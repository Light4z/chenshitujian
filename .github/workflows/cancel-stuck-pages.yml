name: Cancel stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stuck-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/pages-cancel-response -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/8aad822fffa1da436bf5ef3e1fb4f8fef75095e8/cancel")
          echo "HTTP $status"
          cat /tmp/pages-cancel-response
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            exit 1
          fi
