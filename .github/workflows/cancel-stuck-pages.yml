name: Cancel stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stuck-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== Pages site =="
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo "== Stale deployment =="
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/8aad822fffa1da436bf5ef3e1fb4f8fef75095e8"
          echo "== Latest build =="
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          echo "== Cancel stale deployment =="
          status=$(curl -sS -o /tmp/pages-cancel-response -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/8aad822fffa1da436bf5ef3e1fb4f8fef75095e8/cancel")
          echo "HTTP $status"
          cat /tmp/pages-cancel-response
          echo "== Request a new legacy build =="
          reset_status=$(curl -sS -o /tmp/pages-reset-response -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Reset HTTP $reset_status"
          cat /tmp/pages-reset-response
          build_status=$(curl -sS -o /tmp/pages-build-response -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "HTTP $build_status"
          cat /tmp/pages-build-response
          sleep 30
          echo "== Latest build after request =="
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
